name: Keepalive

# 作用：定期向仓库写入一个空提交，产生"仓库活动"，
# 避免 GitHub 因 60 天无活动自动禁用定时工作流（weread-auto-reading）。
# 说明：workflow 文件不属运行时代码，符合 AGENTS.md 约束。

on:
  schedule:
    # 每周一 00:00 UTC 运行一次，远小于 60 天禁用阈值
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
