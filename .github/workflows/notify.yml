name: Feishu Notify
on:
  workflow_dispatch:
    inputs:
      message:
        description: '要发送到飞书的文本'
        required: true
        type: string
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Feishu
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
          MESSAGE: ${{ inputs.message }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          url = os.environ["WEBHOOK"]
          text = os.environ["MESSAGE"]
          data = json.dumps({"msg_type": "text", "content": {"text": text}}).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("feishu status", resp.status, resp.read().decode("utf-8", "replace")[:200])
          PY
